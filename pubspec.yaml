name: echoes_mobile
description: ECHOES mobile — тестовая версия плеера для iPhone (стриминг, без скачивания).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  youtube_explode_dart: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# иконка приложения (генерируется при сборке: dart run flutter_launcher_icons)
flutter_launcher_icons:
  ios: true
  android: false
  image_path: assets/icon.png
  remove_alpha_ios: true
