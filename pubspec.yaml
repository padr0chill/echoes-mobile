name: echoes_mobile
description: ECHOES mobile — музыкальный плеер для iPhone и Android (YouTube Music, SoundCloud, загрузки).
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  # эквалайзер для iOS (своя нативная часть) — packages/echoes_eq
  echoes_eq:
    path: packages/echoes_eq
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  image_picker: ^1.2.4
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  youtube_explode_dart: ^3.1.0
  crypto: ^3.0.8
  cryptography: ^2.9.0
  pointycastle: ^4.0.0
  bip340: ^0.3.1
  flutter_secure_storage: ^11.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  path_provider_platform_interface: ^2.1.3
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/phantom/background.jpg
    - assets/phantom/Inter-OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/phantom/Inter-latin.ttf
    - family: Inter Cyrillic
      fonts:
        - asset: assets/phantom/Inter-cyrillic.ttf
  # «Моя волна» — туманность, как на ПК, считается на видеокарте
  shaders:
    - shaders/nebula.frag
    - shaders/md_warp.frag
    - shaders/md_comp.frag

# иконка приложения (генерируется при сборке: dart run flutter_launcher_icons)
flutter_launcher_icons:
  ios: true
  android: true
  image_path: assets/icon.png
  remove_alpha_ios: true
