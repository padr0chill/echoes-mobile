# Сборка APK для Android на бесплатном облачном Linux GitHub Actions.
# Результат — ECHOES.apk во вкладке Actions → «Build APK» → последний запуск → Artifacts.
#
# Подпись: чтобы новая версия ставилась поверх старой (без удаления плейлистов), все сборки должны быть
# подписаны одним ключом. Добавьте в Settings → Secrets and variables → Actions:
#   ECHOES_KEYSTORE_B64      — файл echoes-release.jks в base64
#   ECHOES_KEYSTORE_PASSWORD — пароль от него
# Без секретов APK подписывается временным ключом — ставится, но обновлять придётся с удалением.
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', '.github/FUNDING.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # та же версия, что у разработчика: тот же коммит всегда собирается одинаково
          flutter-version: 3.47.6
          cache: true

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        # все офлайн-тесты; сетевые и снимки экранов пропускает dart_test.yaml
        run: flutter test

      # Ключ — только перед самой сборкой (зависимости и тесты его не видят) и сразу удаляется после.
      # Без своего ключа каждый APK подписан другим временным — Android не ставит его поверх старого,
      # и пользователю приходится удалять приложение вместе с плейлистами. Поэтому в main это ошибка.
      - name: Signing key
        env:
          KS: ${{ secrets.ECHOES_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ECHOES_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/echoes-release.jks"
            {
              echo "storeFile=$RUNNER_TEMP/echoes-release.jks"
              echo "storePassword=$KS_PASS"
              echo "keyAlias=echoes"
              echo "keyPassword=$KS_PASS"
            } > android/key.properties
            echo "signing: own key"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::ECHOES_KEYSTORE_B64 не задан — такой APK не обновится поверх предыдущего"
            exit 1
          else
            echo "signing: temporary debug key (test build, not for users)"
          fi

      - name: Build APK
        run: |
          # разовые сбои облака (скачивание Gradle/зависимостей) — вторая попытка
          flutter build apk --release --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }} --obfuscate --split-debug-info=build/symbols || \
            flutter build apk --release --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }} --obfuscate --split-debug-info=build/symbols
          cp build/app/outputs/flutter-apk/app-release.apk ECHOES.apk
          ls -lh ECHOES.apk

      - name: Remove signing key
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/echoes-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ECHOES-apk
          path: ECHOES.apk
          retention-days: 30

      # символы отладки: сборка обфусцирована — без них стек ошибки из журнала не расшифровать
      # (flutter symbolize -i <стек> -d <файл .symbols>)
      - uses: actions/upload-artifact@v4
        with:
          name: ECHOES-apk-symbols
          path: build/symbols
          retention-days: 90
