# Раз в неделю — сетевые тесты: YouTube, YouTube Music, SoundCloud, lrclib, Deezer.
# Приложение работает через неофициальные API; когда сервис что-то поменяет, сломаются все установленные
# копии сразу. Красный запуск (GitHub пришлёт письмо) — повод проверить вручную.
# Внимание: YouTube иногда блокирует адреса облачных серверов — падение может быть из-за этого, а не из-за
# изменения API.
name: API watch

on:
  schedule:
    - cron: '0 6 * * 1' # понедельник, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6
          cache: true

      - name: Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Network tests
        run: flutter test --run-skipped --tags network
