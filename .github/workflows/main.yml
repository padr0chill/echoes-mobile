# Сборка IPA на бесплатном облачном Mac GitHub Actions.
# Результат — неподписанный ECHOES.ipa во вкладке Actions → последний запуск → Artifacts.
# Ставится на iPhone через Sideloadly / AltStore (они подписывают его вашим Apple ID).
name: Build IPA

on:
  push:
    branches: [main]
    # описание и скриншоты не требуют новой сборки
    paths-ignore: ['README.md', 'docs/**', '.github/FUNDING.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # та же версия, что у разработчика: тот же коммит всегда собирается одинаково
          flutter-version: 3.47.9
          cache: true

      - name: iOS project (generated, not stored in the repo)
        run: |
          flutter create --platforms=ios --org com.echoes --project-name echoes_mobile .
          rm -f test/widget_test.dart

      - name: Dependencies and icon
        run: |
          flutter pub get --enforce-lockfile
          dart run flutter_launcher_icons

      - name: iOS settings — background audio, name, iOS 13+
        run: |
          P=ios/Runner/Info.plist
          # Keep the launch screen and the Flutter host view dark until Phantom renders its first frame.
          sed -i '' '/key="backgroundColor"/s/red="1" green="1" blue="1"/red="0.02" green="0.02" blue="0.02"/' ios/Runner/Base.lproj/LaunchScreen.storyboard
          sed -i '' '/key="backgroundColor"/s/white="1"/white="0.02"/' ios/Runner/Base.lproj/Main.storyboard
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$P"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$P"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName ECHOES" "$P" || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ECHOES" "$P"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P" || true
          # фото для фона из галереи (image_picker); камеру и микрофон приложение не использует,
          # но плагин требует описания
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string ECHOES берёт выбранное вами фото для фона приложения" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string ECHOES не снимает фото и видео" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string ECHOES не использует микрофон" "$P" || true
          # клипы и звук идут через мини-прокси приложения на 127.0.0.1 (обычный http) — разрешить локальные адреса
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$P" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$P" || true
          sed -i '' "s/^# platform :ios.*/platform :ios, '13.0'/" ios/Podfile || true
          # без NSAllowsLocalNetworking звук через мини-прокси не играет — «|| true» выше могли это скрыть
          test "$(plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw "$P")" = "true"
          test "$(plutil -extract UIBackgroundModes.0 raw "$P")" = "audio"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Tests
        # все офлайн-тесты; сетевые и снимки экранов пропускает dart_test.yaml
        run: flutter test

      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign --build-number=${{ github.run_number }} --dart-define=APP_BUILD=${{ github.run_number }} --obfuscate --split-debug-info=build/symbols

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry ECHOES.ipa Payload
          ls -lh ECHOES.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ECHOES-ipa
          path: ECHOES.ipa
          retention-days: 30

      # символы отладки: сборка обфусцирована — без них стек ошибки из журнала не расшифровать
      # (flutter symbolize -i <стек> -d <файл .symbols>)
      - uses: actions/upload-artifact@v4
        with:
          name: ECHOES-ipa-symbols
          path: build/symbols
          retention-days: 90
